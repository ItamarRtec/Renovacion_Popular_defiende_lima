# fly.toml app configuration file generated for renovacion-popular-defiende-lima-r6z3yw on 2026-08-10T05:44:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'renovacion-popular-defiende-lima-r6z3yw'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024'
